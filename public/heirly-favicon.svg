<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Purple Gradient -->
    <linearGradient id="shield-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>

    <!-- Crimson Gradient -->
    <linearGradient id="shield-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Core Glow -->
    <radialGradient id="shield-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#shield-glow)" />

  <!-- Outer Shield Frame (Purple 3D Body) -->
  <path d="M 256,42 C 340,42 410,72 440,96 C 440,240 390,380 256,470 C 122,380 72,240 72,96 C 102,72 172,42 256,42 Z"
        fill="url(#shield-purple)"
        stroke="#6d28d9"
        stroke-width="6" />

  <!-- Inner Shield Inset (Crimson Accent Layer) -->
  <path d="M 256,70 C 322,70 378,94 405,114 C 405,230 362,345 256,425 C 150,345 107,230 107,114 C 134,94 190,70 256,70 Z"
        fill="none"
        stroke="url(#shield-crimson)"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- 3D 'S' Ribbon Wave Curve -->
  <path d="M 370,140 C 290,120 170,165 170,230 C 170,290 342,260 342,330 C 342,390 220,410 142,375"
        fill="none"
        stroke="url(#shield-purple)"
        stroke-width="38"
        stroke-linecap="round" />

  <path d="M 370,140 C 290,120 170,165 170,230 C 170,290 342,260 342,330 C 342,390 220,410 142,375"
        fill="none"
        stroke="url(#shield-crimson)"
        stroke-width="14"
        stroke-linecap="round" />

  <!-- Keyhole Icon Center -->
  <!-- Top Circle of Keyhole -->
  <circle cx="256" cy="240" r="24" fill="#ffffff" />
  <circle cx="256" cy="240" r="16" fill="#e11d48" />

  <!-- Bottom Trapezoid of Keyhole -->
  <path d="M 244,248 L 268,248 L 274,288 L 238,288 Z" fill="#e11d48" />
</svg>
